<div fxLayout="row wrap">
    <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100">
          <mat-card>
                  <mat-card-content>
                      <mat-card-title>Usuarios</mat-card-title>
                      <div fxLayoutAlign="end center">
                          <button class="bg-danger" mat-raised-button (click)="openDialog(({type:'new'}))">Crear usuario</button>
                      </div>
                      <div>
                          <table mat-table [dataSource]="dataSource" >
                            <ng-container matColumnDef="usuario">
                              <th mat-header-cell *matHeaderCellDef>  Usuario </th>
                              <td mat-cell *matCellDef="let element"> {{ element.userName }} </td>
                            </ng-container>
                            <ng-container matColumnDef="nombre">
                                <th mat-header-cell *matHeaderCellDef>  Nombre </th>
                                <td mat-cell *matCellDef="let element"> {{ element.name }} {{ element.last_Name }} </td>
                            </ng-container>
                            <ng-container matColumnDef="tipo">
                                <th mat-header-cell *matHeaderCellDef>  Tipo </th>
                                <td mat-cell *matCellDef="let element"> {{ element.userType_Name }} </td>
                            </ng-container>
                            <ng-container matColumnDef="cliente">
                                <th mat-header-cell *matHeaderCellDef>  Cliente </th>
                                <td mat-cell *matCellDef="let element"> {{ element.customer_Name }} </td>
                            </ng-container>
                            <ng-container matColumnDef="correo">
                                <th mat-header-cell *matHeaderCellDef>  Correo </th>
                                <td mat-cell *matCellDef="let element"> {{ element.email }} </td>
                            </ng-container>
                            <ng-container matColumnDef="habilitado">
                                <th mat-header-cell *matHeaderCellDef>  Habilitado </th>
                                <td mat-cell *matCellDef="let element">
                                    <mat-icon class="activo" *ngIf="element.status === true" (click)="DeleteUserDialog({type: 'delete', usuario:element})" fontIcon="check_circle">{{ element.status }}</mat-icon>
                                    <mat-icon class="inactivo" *ngIf="element.status === false"  fontIcon="cancel"> {{ element.status }} </mat-icon>
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="creacion">
                                <th mat-header-cell *matHeaderCellDef>  Creación </th>
                                <td mat-cell *matCellDef="let element"> {{element.creation_Date }} </td>
                            </ng-container>
                            <ng-container matColumnDef="editar">
                                <th mat-header-cell *matHeaderCellDef> Editar </th>
                                <td mat-cell *matCellDef="let element">
                                  <button mat-icon-button [disabled]="element.status === false " (click)="openDialog({type: 'edit', usuario:element})" >
                                    <mat-icon>edit</mat-icon>
                                 </button>
                                  <!-- <mat-icon color="primary" (click)="openDialog({type: 'edit', usuario:element})" [disabled]="element.status === true" >edit</mat-icon> -->
                                </td>
                              </ng-container>
                            <!-- <ng-container matColumnDef="eliminar">
                              <th mat-header-cell *matHeaderCellDef> Eliminar </th>
                              <td mat-cell *matCellDef="let element">
                                <mat-icon class="inactivo" (click)="DeleteUserDialog({type: 'delete', usuario:element})">delete</mat-icon>
                              </td>
                            </ng-container> -->
                            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                          </table>
                          <mat-paginator
                            [pageSizeOptions]="[5, 10, 25, 100]"
                            [pageSize]="5"
                          ></mat-paginator>
                        </div>
                  </mat-card-content>        
          </mat-card>
    </div>
</div>
