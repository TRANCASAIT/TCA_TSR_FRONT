<div fxLayout="row wrap" fxLayoutAlign="space-between stretch">

    <form fxLayout="row wrap" fxFlex="100" [formGroup]="cPorteForm">
            <div fxFlex.gt-sm="100"  fxFlex="100" class=" danger">
                    <div fxLayout="row wrap " fxLayoutAlign="space-between stretch" class="p-30">
                        <!-- <h3 fxFlex="100" class="text-bold text-center m-b-20 m-t-0">Numero de Carta Porte</h3> -->
                        <mat-card-title class="text-bold text-center m-b-20 m-t-0" class="warn">Número de Carta Porte</mat-card-title>
                            <mat-form-field fxFlex.gt-xs="100" fxFlex="100">
                                <mat-label>Folio: {{solicitudServicio}} || Parada: {{parada}}</mat-label>
                                <input matInput placeholder="id" formControlName="serviceRequestId"
                                        [errorStateMatcher]="matcher" hidden>
                                <input matInput placeholder="id" formControlName="documentId"
                                [errorStateMatcher]="matcher" hidden>
                                </mat-form-field>
                            <mat-form-field fxFlex.gt-xs="100" fxFlex="100">
                                    <input matInput placeholder="Num. carta porte" formControlName="cPorteNumber"
                                            [errorStateMatcher]="matcher">
                                    <mat-error> Este campo es requerido </mat-error>
                            </mat-form-field>
                            <div fxFlex="100" fxLayout="row wrap" fxLayoutAlign="space-between end" class="p-t-30 m-auto">
                                    <div fxFlex="50" fxLayoutAlign="center center">
                                            <button [disabled]="cPorteForm.invalid" *ngIf="type === 'new'" class="actionBtn" mat-raised-button (click)="this.setConsigmentNumber()"> Registrar </button>
                                    </div>
                                    <div fxFlex="50"  fxLayoutAlign="center center">
                                            <button mat-raised-button class="closeBtn" (click)="dialogRef.close()"> Cerrar </button>
                                    </div>
                            </div>
                            
                    </div>
            </div>
           
    </form>
</div>
