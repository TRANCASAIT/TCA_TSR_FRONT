<div fxLayout="row wrap" fxLayoutAlign="space-between stretch">

    <form fxLayout="row wrap" fxFlex="100" [formGroup]="statusForm">
            <div fxFlex.gt-sm="100"  fxFlex="100" class=" danger">
                    <div fxLayout="row wrap " fxLayoutAlign="space-between stretch" class="p-30">
                            <h3 fxFlex="100" class="text-bold text-center m-b-20 m-t-0">Estatus</h3>
                                <input matInput placeholder="id" formControlName="statusId"
                                        [errorStateMatcher]="matcher" hidden>
                            <mat-form-field fxFlex.gt-xs="100" fxFlex="100">
                                    <input matInput placeholder="Nombre" formControlName="statusDescription"
                                            [errorStateMatcher]="matcher">
                                    <mat-error> Este campo es requerido </mat-error>
                            </mat-form-field>
                            <div fxFlex="100" fxLayout="row wrap" fxLayoutAlign="space-between end" class="p-t-30 m-auto">
                                    <div fxFlex="50" fxLayoutAlign="center center">
                                            <button [disabled]="statusForm.invalid" *ngIf="type === 'new'" class="actionBtn" mat-raised-button (click)="this.createStatus()"> Crear </button>
                                            <button [disabled]="statusForm.invalid" *ngIf="type === 'edit'" class="actionBtn" mat-raised-button (click)="this.updateStatus()"> Editar </button>

                                    </div>
                                    <div fxFlex="50"  fxLayoutAlign="center center">
                                            <button mat-raised-button class="closeBtn" (click)="dialogRef.close()"> Cerrar </button>
                                    </div>
                            </div>
                            
                    </div>
            </div>
           
    </form>
</div>
